name: Refresh site

# The site should not wait on the email. When Gmail refused auth on 14 Sep the
# whole job died and the published page went stale for a day — on exactly the
# morning something had gone wrong. So publishing lives here, on its own clock,
# and never touches mail or state.

on:
  schedule:
    # Every four hours, off the top of the hour (GitHub queues :00 heavily).
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with the daily digest on purpose: both push to main, and two pushes
  # racing is how you get a rejected non-fast-forward at 4am.
  group: doggos-commit
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Rebuild the page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python digest.py --site-only

      - name: Commit the page
        run: |
          git config user.name  "doggo-bot"
          git config user.email "doggo-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Page unchanged."
          else
            git commit -m "site: $(date -u +'%Y-%m-%d %H:%M')"
            # The digest may have pushed since checkout; rebase rather than fail.
            git pull --rebase --autostash
            git push
          fi
