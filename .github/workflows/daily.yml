name: Daily doggo digest

on:
  schedule:
    # 11:23 UTC = 7:23am Eastern during daylight saving, 6:23am in winter.
    #
    # The minute is deliberately not :00. GitHub's scheduler is best-effort and
    # queues everyone's cron on shared capacity; "0" is by far the most common
    # minute, so jobs there wait behind the crowd. A first run at "0 11" landed
    # 3h40m late (14:40 UTC). Off-peak minutes are the standard mitigation —
    # they reduce the wait a lot, but nothing here guarantees a delivery time.
    - cron: "23 11 * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Build without sending or saving state"
        type: boolean
        default: false
      test_email:
        description: "Send a test email now, changing nothing"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit seen.json and docs/

concurrency:
  # Shared with "Refresh site" — both push to main, and two pushes racing is
  # how you get a rejected non-fast-forward at 4am.
  group: doggos-commit
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Only needed if you use a non-Gmail SMTP provider
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python digest.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.test_email && '--test' || '' }}

      - name: Commit state and page
        # !cancelled() rather than success(): when the mail server refuses,
        # digest.py still built the page and exits 1 on purpose. Without this the
        # step is skipped and the site silently goes stale on exactly the days
        # something went wrong.
        if: ${{ !cancelled() && !inputs.dry_run && !inputs.test_email }}
        run: |
          git config user.name  "doggo-bot"
          git config user.email "doggo-bot@users.noreply.github.com"
          git add seen.json docs/
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
