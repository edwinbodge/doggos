name: Daily doggo digest

on:
  schedule:
    # 11:00 UTC = 7am Eastern during daylight saving, 6am in winter.
    # GitHub's scheduler is best-effort and can run a few minutes late.
    - cron: "0 11 * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Build without sending or saving state"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit seen.json and docs/

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Only needed if you use a non-Gmail SMTP provider
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python digest.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state and page
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "doggo-bot"
          git config user.email "doggo-bot@users.noreply.github.com"
          git add seen.json docs/
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
